services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=sqlite:////data/claims.db
      - MLRUNS_DIR=${MLRUNS_DIR:-/mlruns}
    volumes:
      - claims_data:/data
      - mlruns_data:${MLRUNS_DIR:-/mlruns}

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    environment:
      - MLFLOW_ALLOW_FILE_STORE=true
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri file:///mlruns
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlruns_data:/mlruns
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  claims_data:
  mlruns_data:
